
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>
<style>
body {
  font-family: Arial;
  background: #eaf2ee;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.box {
  background: white;
  padding: 30px;
  border-radius: 12px;
  width: 85%;
  max-width: 350px;
  text-align: center;
}
input {
  width: 95%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 6px;
  box-sizing: border-box;
}
button {
  width: 100%;
  padding: 12px;
  background: #087a45;
  color: white;
  border: 0;
  border-radius: 6px;
}
#message { color: red; }
</style>
</head>
<body>
<div class="box">
<h2>Admin Login</h2>
<form id="loginForm">
<input id="username" placeholder="ইউজারনেম" required>
<input id="password" type="password" placeholder="পাসওয়ার্ড" required>
<button type="submit">লগইন করুন</button>
</form>
<p id="message"></p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  try {
   const response = await fetch("/api/admin/login", { 
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username, password})
    });

    const data = await response.json();

    if (data.success) {
      message.style.color = "green";
      message.textContent = "লগইন সফল হয়েছে।";
    } else {
      message.textContent = data.message || "লগইন ব্যর্থ হয়েছে।";
    }
  } catch {
    message.textContent = "সার্ভারের সঙ্গে সংযোগ হচ্ছে না।";
  }
});
</script>
</body>
</html>
